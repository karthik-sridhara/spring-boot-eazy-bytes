spring.application.name=jobportal
logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}

spring.datasource.url = jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:61530};databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.jpa.hibernate.ddl-auto=none
#spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/jobportal-schema.sql
spring.sql.init.data-locations=classpath:sql/jobportal-data.sql
logging.level.org.springframework.jdbc.datasource.init=DEBUG
#spring.jpa.properties.hibernate.jdbc.time_zone=UTC

springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
#spring.docker.compose.file=jobportal-compose.yml
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.start.command=up
spring.docker.compose.stop.command=stop

spring.mvc.apiversion.use.header=Api-Version
